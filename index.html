<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atlas Rhythm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="menu-screen">
        <h1 class="logo-text">ATLAS RHYTHM</h1>
        
        <div id="player-select-container">
            <h3>WHO IS PLAYING?</h3>
            <div id="player-buttons">
                <button class="player-btn" data-name="Atlas">ATLAS</button>
                <button class="player-btn" data-name="Dad">DAD</button>
                <button class="player-btn" data-name="Travis">TRAVIS</button>
            </div>
            <p id="current-player-display">Playing as: <span id="player-name">...</span></p>
        </div>
        
        <div id="song-list"></div>

        <div id="trademark">© ATLAS GAMES EST. 2025 | PATENT PENDING</div>
    </div>

    <div id="song-modal" style="display: none;">
        <div class="modal-content">
            <button id="close-modal-btn">⬅ BACK</button>
            
            <h2 id="modal-song-title">Song Title</h2>
            <p id="modal-song-artist">Artist</p>
            
            <div class="modal-stats">
                <div class="stat-box" style="width: 100%;">
                    <p class="stat-label">SELECT DIFFICULTY</p>
                    <div id="difficulty-selectors" style="margin-top: 10px; display: flex; justify-content: center; gap: 10px;">
                    </div>
                </div>
            </div>
            
            <div class="modal-stats">
                <div class="stat-box" style="width: 100%;">
                    <p class="stat-label">YOUR BEST</p>
                    <p id="modal-personal-best" class="stat-val">0</p>
                </div>
            </div>

            <div class="modal-leaderboard">
                <h3>TOP SCORES</h3>
                <ul id="modal-leaderboard-list"></ul>
            </div>

            <button id="groovy-btn">START SONG</button>
        </div>
    </div>

    <div id="game-container" style="display:none;">
        <button id="back-to-menu-btn" class="game-back-btn">⬅ MENU</button>
        <video id="bg-video" playsinline webkit-playsinline></video>
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="score">Score: 0</div>
            <div id="combo-hud">
                <div id="combo-count">0</div>
                <div id="combo-label">COMBO</div>
            </div>
            <div id="multiplier-hud"><span id="multiplier-val">x1</span></div>
        </div>
        <div id="start-btn">TAP TO START</div>
        <div id="results-screen">
            <h2>SONG COMPLETE!</h2>
            <div class="result-box">
                <p>Score: <span id="final-score-val">0</span></p>
                <p>Max Combo: <span id="final-combo-val">0</span></p>
            </div>
            <div class="result-buttons">
                <button id="replay-btn">PLAY AGAIN</button>
                <button id="menu-btn">MENU</button>
            </div>
        </div>
    </div>

    <script src="js/note-manager.js"></script>
    <script src="js/game.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
